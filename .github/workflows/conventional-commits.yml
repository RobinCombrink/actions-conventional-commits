name: conventional-commits

on:
  workflow_call: {}

jobs:
  lint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the shared committed.toml unless the caller has its own
        shell: bash
        run: |
          if [ -f committed.toml ] || [ -f .committed.toml ]; then
            echo "Caller ships its own committed config - using it."
            exit 0
          fi
          curl -fsSL -o committed.toml https://raw.githubusercontent.com/RobinCombrink/actions-conventional-commits/ff60392ebb30b3b1ab8868be841930a5e26ad44e/committed.toml

      - name: Resolve the range, leaving it empty for a new ref that has no before-commit
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "commits=HEAD~..HEAD^2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "commits=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commits=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"

      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        if: steps.range.outputs.commits != ''
        with:
          commits: ${{ steps.range.outputs.commits }}
